name: Deploy Ephemeral Environment

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      - name: Install cdkeph
        run: npm install -g aws-cdk-ephemeral

      - name: Deploy ephemeral environment
        run: cdkeph deploy

      # Optional: Run tests against the deployed environment
      # - name: Run integration tests
      #   run: npm test

  destroy-on-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install cdkeph
        run: npm install -g aws-cdk-ephemeral

      - name: Destroy ephemeral environment
        run: cdkeph destroy
